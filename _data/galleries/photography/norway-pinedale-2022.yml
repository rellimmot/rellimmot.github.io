# Photography set data.
#
# Point at ONE image source:
#   s3_prefix: <folder>    real sets. Images at
#                          https://s3.us-east-2.amazonaws.com/rellimmot/assets/images/photography/<folder>/
#                          Objects must be publicly readable, see the note below.
#   local_path: <folder>   images committed to this repo under
#                          assets/images/photography/<folder>/
#                          Fine for small or placeholder sets.
#
# Two files per picture, both in the same folder:
#   full   long edge 2048px, JPEG quality ~85, shown in the lightbox
#   thumb  long edge  800px, JPEG quality ~80, shown in the grid
#
# Dimensions are read from the filename (NAME-WIDTHxHEIGHT.jpg) by
# _includes/photoswipe-gallery.html, so never write them out separately.
# Strip GPS from EXIF before uploading.
#
# caption is optional and shows in the lightbox. alt is optional and falls
# back to caption.
#
# S3 note: uploading is not enough. The bucket has no policy granting public
# read, so a new object is private and returns 403 to visitors. Grant read on
# assets/images/* before pointing a set at s3_prefix.
#
# The images in this set are generated placeholders, not real photographs.


