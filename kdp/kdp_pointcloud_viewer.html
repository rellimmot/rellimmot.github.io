<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KDP Kart 3D Viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #121212; color: #ddd; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  #bar { position: fixed; top: 8px; left: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; z-index: 2; }
  button { background: #2a2a2a; color: #ddd; border: 1px solid #555; border-radius: 4px; padding: 5px 9px; font: inherit; cursor: pointer; }
  button:hover { background: #3a3a3a; }
  button.on { border-color: #e8c84a; color: #e8c84a; }
  select { background: #2a2a2a; color: #ddd; border: 1px solid #555; border-radius: 4px; padding: 4px 6px; font: inherit; }
  label { display: flex; gap: 5px; align-items: center; }
  [hidden] { display: none !important; }
  .sep { opacity: .5; }
  #layers { position: fixed; top: 46px; left: 8px; width: 270px; max-height: calc(100% - 100px); overflow-y: auto; background: rgba(0,0,0,.66); border: 1px solid #333; border-radius: 6px; padding: 6px 8px 8px; z-index: 2; }
  #layers.closed .body { display: none; }
  #layers h3 { margin: 0; font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
  #layers .grp { margin: 9px 0 3px; color: #e8c84a; font-size: 12px; }
  #layers .sub { color: #999; font-size: 11px; margin: -2px 0 3px; }
  #layers label { padding: 2px 0; cursor: pointer; }
  #layers label.off { opacity: .45; cursor: not-allowed; }
  #layers .nm { flex: 1; }
  #layers .sz { color: #999; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #layers .st { color: #8fd18f; font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 34px; text-align: right; }
  #layers .st.err { color: #e07a76; }
  #layers .sw { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
  #layers .row2 { display: flex; gap: 6px; margin-top: 8px; }
  #layers label.inside .nm { opacity: .55; }
  #layers .hint { color: #999; font-size: 11px; margin: 0 0 3px 22px; }
  #layers label.pare { margin: 0 0 2px 22px; padding: 0; color: #999; font-size: 11px; cursor: default; }
  #layers label.pare input { flex: 1; min-width: 0; margin: 0; }
  #layers label.pare span { min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #legend { margin: 2px 0 2px 22px; }
  #legend .ramp { height: 8px; border-radius: 4px; background: linear-gradient(90deg, rgb(40,80,255), rgb(0,210,255), rgb(40,220,80), rgb(255,220,0), rgb(255,50,30)); }
  #legend .ends { display: flex; justify-content: space-between; color: #999; font-size: 11px; }
  #cut { position: fixed; top: 46px; right: 8px; width: 290px; background: rgba(0,0,0,.66); border: 1px solid #333; border-radius: 6px; padding: 6px 8px 8px; z-index: 2; }
  #cut.closed .body { display: none; }
  #cut h3 { margin: 0; font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
  #cut .sub { color: #999; font-size: 11px; margin: 4px 0 6px; }
  #cut .cutrow { margin: 7px 0 0; }
  #cut .cutrow .top { display: flex; align-items: center; gap: 6px; }
  #cut .cutrow label { flex: 1; cursor: pointer; }
  #cut .cutrow .val { color: #999; font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 62px; text-align: right; }
  #cut .cutrow button { padding: 2px 7px; min-width: 62px; }
  #cut .cutrow input[type=range] { width: 100%; margin: 3px 0 0; }
  #cut .row2 { display: flex; gap: 6px; margin-top: 8px; }
  #tabs { display: none; }
  #opts { display: contents; }
  /* Phone: view buttons, then two tabs. A tab opens its panel below, one at a time. The settings
     and the point count sit inside the Layers panel there, and the hint line is left out. */
  @media (max-width: 640px) {
    #bar .sep { display: none; }
    #bar > button { flex: 1; padding: 6px 2px; }
    #tabs { display: flex; flex-basis: 100%; gap: 6px; }
    #tabs button { flex: 1; padding: 7px 4px; }
    #layers, #cut { left: 8px; right: 8px; width: auto; max-width: none; overflow-y: auto; box-sizing: border-box; background: rgba(0,0,0,.8); }
    #layers.closed, #cut.closed { display: none; }
    #layers h3, #cut h3 { display: none; }
    #layers label, #cut .cutrow { padding: 4px 0; }
    #layers #opts { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 2px 0 6px; }
    #layers #opts .sep { display: none; }
    #layers #opts label { cursor: default; gap: 8px; }
    #layers #opts label:has(input[type=range]) { flex: 1 1 150px; }
    #layers #opts label:has(#fill) { flex-basis: 100%; }
    #layers #opts input[type=range] { flex: 1; min-width: 0; }
    #layers #status { position: static; background: none; padding: 0 0 8px; margin-bottom: 4px; border-bottom: 1px solid #333; color: #999; }
    #help { display: none; }
  }
  #status { position: fixed; bottom: 8px; left: 8px; background: rgba(0,0,0,.6); padding: 4px 8px; border-radius: 4px; z-index: 2; }
  #help { position: fixed; bottom: 8px; right: 8px; background: rgba(0,0,0,.6); padding: 4px 8px; border-radius: 4px; z-index: 2; max-width: calc(100% - 16px); }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="bar">
  <button data-view="iso">3/4</button>
  <button data-view="left">Left</button>
  <button data-view="right">Right</button>
  <button data-view="front">Front</button>
  <button data-view="rear">Rear</button>
  <button data-view="top">Top</button>
  <button data-view="below">Below</button>
  <div id="tabs"><button data-tab="layers">Layers</button><button data-tab="cut">Split view</button></div>
  <span class="sep">|</span>
  <div id="opts">
  <label title="How many points the clouds are loaded with. Applies to every cloud that comes in more than one density.">Density
    <select id="density"><option value="light">Light</option><option value="medium">Medium</option><option value="full" selected>Full</option></select></label>
  <label>Point size <input id="size" type="range" min="1" max="6" step="0.5" value="2"></label>
  <label><input id="tint" type="checkbox"> Colour by layer</label>
  <label><input id="axes" type="checkbox" checked> Axes and floor grid</label>
  <span class="sep">|</span>
  <label title="Adds estimated points where a surface has holes, for the dense clouds of scan 2. They are predictions from the shape around a hole, not measurements.">Predicted fill
    <input id="fill" type="range" min="0" max="11" step="1" value="0"><span id="fillVal">off</span></label>
  <label title="Shows the predicted points in one colour, so they stand out from the measured points."><input id="fillFlag" type="checkbox"> Mark predicted</label>
  </div>
</div>
<div id="layers">
  <h3 id="layersHead"><span>Layers</span><span id="layersTog">hide</span></h3>
  <div class="body"><div id="firstList"></div><div id="layerList"></div></div>
</div>
<div id="cut">
  <h3 id="cutHead"><span>Split view</span><span id="cutTog">hide</span></h3>
  <div class="body">
    <div class="sub">Slide to cut the model open along an axis. The button picks the side that stays.</div>
    <div class="cutrow" data-axis="0" data-low="Rear" data-high="Front">
      <div class="top"><label><input type="checkbox"> Along the length (X)</label><span class="val"></span><button></button></div>
      <input type="range" min="-130" max="60" step="0.25" value="-35">
    </div>
    <div class="cutrow" data-axis="1" data-low="Right" data-high="Left">
      <div class="top"><label><input type="checkbox"> Across the width (Y)</label><span class="val"></span><button></button></div>
      <input type="range" min="-75" max="75" step="0.25" value="0">
    </div>
    <div class="cutrow" data-axis="2" data-low="Below" data-high="Above">
      <div class="top"><label><input type="checkbox"> Height (Z)</label><span class="val"></span><button></button></div>
      <input type="range" min="0" max="140" step="0.25" value="40">
    </div>
    <div class="row2"><button id="cutReset">Reset</button></div>
  </div>
</div>
<div id="status"></div>
<div id="help">Drag: rotate · Right-drag: pan · Wheel: zoom · Inches; X forward (red), Y left (green), Z up (blue)</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';

// Every layer can be switched on and off on its own; several can be shown together.
// All of them are in the kart frame (inches), so they overlay each other.
const LAYERS = [
  { group: 'Scan 1 · outside' },
  { id: 'voxel', label: 'Point cloud', variants: [
    { key: 'light', file: 'kdp_pointcloud_light.ply', mb: 3.1 },
    { key: 'medium', file: 'kdp_pointcloud.ply', mb: 9 },
    { key: 'full', file: 'kdp_pointcloud_full.ply', mb: 46 } ] },
  { id: 'textured', label: 'Photo mesh', file: 'kdp_mesh.ply', texture: 'kdp_mesh.jpg', mb: 15 },
  { group: 'Scan 2 · inside and underside', sub: 'placed in the kart frame with scan 1' },
  { id: 'scan2sparse', label: 'Sparse points', file: 'kdp_scan2_sparse.ply', mb: 10.6 },
  { id: 'scan2path', label: 'Camera path', file: 'kdp_scan2_campath.ply', path: true, mb: 0.03 },
];
// Dense clouds of scan 2 are listed in a small file, so new ones show up without a page change.
const MORE = 'kdp_scan2_layers.json';
const TINTS = [0xe8c84a, 0x4ac2e8, 0xe86a4a, 0x7be84a, 0xc04ae8, 0x4a78e8, 0xe84aa0, 0x4ae8b4, 0xe8a04a, 0x9a9a9a];
// The photo mesh is in the first scan's model units; this moves it into the kart frame.
const TO_KART = new THREE.Matrix4().set(26.448866, 0.51306803, -0.250351353, -43.8972887, 0.300778971, -2.66296169, 26.3189398, 6.85119062, 0.485228414, -26.3156573, -2.66817487, 60.5748317, 0, 0, 0, 1);
const CENTER = new THREE.Vector3(-35, 0, 45);

const $ = (id) => document.getElementById(id);
const statusEl = $('status');

THREE.Object3D.DEFAULT_UP.set(0, 0, 1);
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x121212);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 1, 5000);
camera.up.set(0, 0, 1);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(CENTER);
controls.enableDamping = true;

const helpers = new THREE.Group();
const grid = new THREE.GridHelper(240, 20, 0x666666, 0x333333); // 12 in squares
grid.rotation.x = Math.PI / 2; grid.position.set(-35, 0, 0);
helpers.add(grid, new THREE.AxesHelper(36));
scene.add(helpers);
scene.add(new THREE.HemisphereLight(0xffffff, 0x555555, 1.6));

const VIEWS = {
  iso: [220, 210, 110], left: [0, 330, 0], right: [0, -330, 0],
  front: [330, 0, 0], rear: [-330, 0, 0], top: [0, 0.01, 380], below: [0, 0.01, -300],
};
function setView(name) {
  const o = VIEWS[name];
  camera.position.set(CENTER.x + o[0], CENTER.y + o[1], CENTER.z + o[2]);
  controls.target.copy(CENTER);
  controls.update();
}
setView('iso');

const state = {};   // id -> { def, object, material, points, faces, loading, row }
let pointSize = 2, tintOn = false, tintNo = 0;
const RANK = { light: 0, medium: 1, full: 2 };
let density = RANK[new URLSearchParams(location.search).get('density')] !== undefined ? new URLSearchParams(location.search).get('density') : 'full';
// The file of a layer at the chosen density (the closest one it has).
function pick(def) {
  if (!def.variants) return def;
  let best = null;
  for (const v of def.variants) if (!best || Math.abs(RANK[v.key] - RANK[density]) < Math.abs(RANK[best.key] - RANK[density])) best = v;
  return best;
}
// Predicted fill: extra points sampled on a surface fitted through a dense cloud. They are kept in
// their own files, sorted by distance to the nearest measured point, so the slider only changes
// how many of them are drawn. They are estimates, never measurements.
const GAPS = [0, 0.25, 0.5, 0.75, 1, 1.5, 2, 2.5, 3, 4, 5, 6];   // widest gap that gets filled, inches
const FILL_MARK = 0xff4df0;
let gap = 0, markFill = false;
function pickFill(def) {
  if (!Array.isArray(def.fill) || !def.fill.length) return null;
  let best = null;
  for (const v of def.fill) if (!best || Math.abs(RANK[v.key] - RANK[density]) < Math.abs(RANK[best.key] - RANK[density])) best = v;
  return best;
}
function fillCount(f) { let n = 0; for (const st of f.steps) if (st[0] <= gap) n = st[1]; return n; }
function styleFill(s) {
  const m = s.fillLook; if (!m) return;
  m.size = pointSize; m.vertexColors = !(markFill || tintOn); m.color.set(markFill ? FILL_MARK : (tintOn ? s.tint : 0xffffff)); m.needsUpdate = true;
}
function dropFill(s) {
  s.fillToken = (s.fillToken || 0) + 1; s.fillLoading = false; s.fillShown = 0;
  if (s.fillObj) { scene.remove(s.fillObj); s.fillObj.geometry.dispose(); s.fillObj = null; s.fillLook = null; }
}
function updateFill() {
  for (const id in state) {
    const s = state[id], f = pickFill(s.def);
    if (!f) continue;
    if (s.fillObj && s.fillKey !== f.key) dropFill(s);            // the density changed
    const on = gap > 0 && s.box.checked && s.object && s.object.visible;
    if (!on) { if (s.fillObj) s.fillObj.visible = false; s.fillShown = 0; continue; }
    if (s.fillObj) { const n = fillCount(f); s.fillObj.geometry.setDrawRange(0, n); s.fillObj.visible = n > 0; s.fillShown = n; continue; }
    if (s.fillLoading || s.fillFailed === f.file) continue;
    s.fillLoading = true;
    const tok = s.fillToken = (s.fillToken || 0) + 1;
    new PLYLoader().load(f.file, (geo) => {
      if (tok !== s.fillToken) { geo.dispose(); return; }
      s.fillLoading = false; s.fillKey = f.key;
      s.fillLook = new THREE.PointsMaterial({ size: pointSize, sizeAttenuation: false, vertexColors: true });
      s.fillObj = new THREE.Points(geo, s.fillLook);
      styleFill(s); scene.add(s.fillObj); refresh();
    }, undefined, () => { if (tok === s.fillToken) { s.fillLoading = false; s.fillFailed = f.file; } });
  }
}

// Noise paring: the combined cloud is stored sorted from the best supported point to the most
// isolated one, and its entry in the layer list says how many points stay at each paring radius
// (a point is pared at a radius if it, or the small clump it sits in, has nothing else within that
// distance). So the slider only changes how many points are drawn. 0 = off.
const pareAsked = (() => { const q = new URLSearchParams(location.search).get('pare'); return q !== null && /^\d+(\.\d+)?$/.test(q) ? +q : null; })();
let pare = 0;
const pareUi = [];
function pareRadii(def) { const v = (def.variants || []).find(x => Array.isArray(x.steps) && x.steps.length); return v ? v.steps.map(st => st[0]).sort((a, b) => b - a) : []; }
function nearestRadius(radii, r) { let best = radii[0]; for (const x of radii) if (Math.abs(x - r) < Math.abs(best - r)) best = x; return best; }
function fmtCount(n) { return n >= 1e6 ? (n / 1e6).toFixed(2) + 'M' : (n / 1000).toFixed(0) + 'k'; }
function applyPare(s) {
  const v = (s.def.variants || []).find(x => x.key === s.loadedKey);
  if (!v || !Array.isArray(v.steps) || !s.object || !s.object.isPoints) return;
  const all = s.object.geometry.attributes.position.count;
  let n = all;
  if (pare > 0) for (const st of v.steps) if (st[0] === pare) n = Math.min(all, st[1]);
  s.object.geometry.setDrawRange(0, n);
  s.points = n; s.pared = all - n; s.stEl.textContent = fmtCount(n);
}
function setPare(r) {
  pare = r;
  for (const u of pareUi) { u.slider.value = r ? u.radii.indexOf(r) + 1 : 0; u.val.textContent = r ? r + ' in' : 'off'; }
  for (const id in state) applyPare(state[id]);
  refresh();
}
// The clouds a combined cloud was made from are marked while it is on: they add nothing on top of it.
function markCovered(s) {
  if (!Array.isArray(s.def.covers)) return;
  const on = s.box.checked, names = [];
  for (const id of s.def.covers) { const c = state[id]; if (!c) continue; c.row.classList.toggle('inside', on); names.push(c.def.label); }
  s.hint.textContent = 'Already holds ' + names.join(', ') + '. No need to tick those as well.';
  s.hint.hidden = !on || !names.length;
}

function checkFile(s) {
  // Grey out anything whose file is not there (yet), so a click cannot end in an error.
  const src = pick(s.def), tok = s.token;
  s.box.disabled = false; s.row.classList.remove('off'); s.row.title = s.def.title || src.file;
  fetch(src.file, { method: 'HEAD', cache: 'no-store' }).then(r => {
    if (tok !== s.token || r.ok) return;
    s.box.disabled = true; s.box.checked = false; s.row.classList.add('off'); s.stEl.textContent = 'not ready'; s.row.title = 'This file has not been made yet. Reload the page later.';
  }).catch(() => {});
}

function fmtMb(mb) { return mb == null ? '' : (mb < 1 ? Math.round(mb * 1000) + ' KB' : (mb >= 10 ? Math.round(mb) : mb.toFixed(1)) + ' MB'); }

function addRow(def, list = $('layerList')) {
  if (def.group && !def.id) {
    const g = document.createElement('div'); g.className = 'grp'; g.textContent = def.group; list.appendChild(g);
    if (def.sub) { const s = document.createElement('div'); s.className = 'sub'; s.textContent = def.sub; list.appendChild(s); }
    return;
  }
  const st = state[def.id] = { def, tint: TINTS[tintNo++ % TINTS.length], token: 0 };
  const row = document.createElement('label');
  row.innerHTML = '<input type="checkbox"><span class="sw"></span><span class="nm"></span><span class="sz"></span><span class="st"></span>';
  row.querySelector('.nm').textContent = def.label;
  st.szEl = row.querySelector('.sz');
  st.szEl.textContent = fmtMb(pick(def).mb);
  row.querySelector('.sw').style.background = def.path ? 'linear-gradient(90deg, rgb(40,80,255), rgb(40,220,80), rgb(255,50,30))' : (def.texture ? '#777' : '#' + st.tint.toString(16).padStart(6, '0'));
  st.row = row; st.box = row.querySelector('input'); st.stEl = row.querySelector('.st');
  st.box.onchange = () => toggle(def.id, st.box.checked);
  list.appendChild(row);
  if (def.path) {
    const lg = document.createElement('div'); lg.id = 'legend'; lg.hidden = true;
    lg.innerHTML = '<div class="ramp"></div><div class="ends"><span>start of the walk</span><span>end</span></div>';
    list.appendChild(lg); st.legend = lg;
  }
  if (Array.isArray(def.covers)) { st.hint = document.createElement('div'); st.hint.className = 'hint'; st.hint.hidden = true; list.appendChild(st.hint); }
  const radii = pareRadii(def);
  if (radii.length) {
    const p = document.createElement('label'); p.className = 'pare';
    p.title = 'Leaves out stray points: a point, or a small clump of points, that has nothing else within this distance. Further right pares more. The points are only hidden, not removed.';
    p.innerHTML = 'Noise paring <input type="range" min="0" step="1"><span></span>';
    const u = { radii, slider: p.querySelector('input'), val: p.querySelector('span') };
    u.slider.max = radii.length;
    u.slider.oninput = () => setPare(+u.slider.value ? radii[+u.slider.value - 1] : 0);
    list.appendChild(p); pareUi.push(u);
    // opens with the radius from the address (?pare=0.3; ?pare=0 is off), else with the layer's own
    const start = pareAsked !== null ? pareAsked : (typeof def.pare === 'number' ? def.pare : 0);
    setPare(start > 0 ? nearestRadius(radii, start) : 0);
  }
  checkFile(st);
}

function setDensity(d) {
  density = d;
  for (const id in state) {
    const s = state[id];
    if (!s.def.variants) continue;
    s.szEl.textContent = fmtMb(pick(s.def).mb);
    if (s.loadedKey === pick(s.def).key && s.object) continue;
    const wasOn = s.box.checked;
    s.token++; s.loading = false;                    // anything still loading for the old density is dropped
    if (s.object) { scene.remove(s.object); s.object.traverse(o => { if (o.geometry) o.geometry.dispose(); }); s.object = null; }
    s.points = 0; s.faces = 0; s.pared = 0; s.stEl.textContent = ''; s.stEl.classList.remove('err');
    checkFile(s);
    if (wasOn) toggle(id, true);
  }
  refresh();
}

function refresh() {
  updateFill();
  let pts = 0, faces = 0, n = 0, pred = 0, cut = 0;
  for (const id in state) { const s = state[id]; if (s.object && s.object.visible && s.box.checked) { pts += s.points || 0; faces += s.faces || 0; pred += s.fillShown || 0; cut += s.pared || 0; n++; } }
  const parts = [];
  if (pts) parts.push(pts.toLocaleString() + ' points');
  if (cut) parts.push(cut.toLocaleString() + ' pared as noise');
  if (pred) parts.push('+ ' + pred.toLocaleString() + ' predicted');
  if (faces) parts.push(faces.toLocaleString() + ' faces');
  statusEl.textContent = n ? parts.join(' · ') + ' · ' + n + (n === 1 ? ' layer' : ' layers') : 'No layer shown. Tick one in the list.';
  const shown = {}; for (const id in state) if (state[id].object && state[id].box.checked) shown[id] = { points: state[id].points || 0, faces: state[id].faces || 0 };
  window.__kart = { shown, points: pts, faces, predicted: pred, pared: cut, pare };
}

function buildPath(geo) {
  // Camera positions in time order: dots, joined by lines where two neighbours are close.
  const pos = geo.attributes.position, col = geo.attributes.color, p = [], c = [];
  for (let i = 0; i + 1 < pos.count; i++) {
    const dx = pos.getX(i + 1) - pos.getX(i), dy = pos.getY(i + 1) - pos.getY(i), dz = pos.getZ(i + 1) - pos.getZ(i);
    if (dx * dx + dy * dy + dz * dz > 20 * 20) continue;   // a jump: frames in between did not register
    p.push(pos.getX(i), pos.getY(i), pos.getZ(i), pos.getX(i + 1), pos.getY(i + 1), pos.getZ(i + 1));
    c.push(col.getX(i), col.getY(i), col.getZ(i), col.getX(i + 1), col.getY(i + 1), col.getZ(i + 1));
  }
  const lg = new THREE.BufferGeometry();
  lg.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  lg.setAttribute('color', new THREE.Float32BufferAttribute(c, 3));
  const g = new THREE.Group();
  g.add(new THREE.LineSegments(lg, new THREE.LineBasicMaterial({ vertexColors: true })));
  g.add(new THREE.Points(geo, new THREE.PointsMaterial({ size: 5, sizeAttenuation: false, vertexColors: true })));
  return g;
}

function applyTint(s) {
  if (!s.material) return;
  s.material.vertexColors = !tintOn; s.material.color.set(tintOn ? s.tint : 0xffffff); s.material.needsUpdate = true;
  styleFill(s);
}

function toggle(id, on) {
  const s = state[id]; if (!s) return;
  s.box.checked = on;
  if (s.legend) s.legend.hidden = !on;
  markCovered(s);
  if (s.object) { s.object.visible = on; refresh(); return; }
  if (!on || s.loading) { refresh(); return; }
  s.loading = true; s.stEl.classList.remove('err'); s.stEl.textContent = '0 %';
  const src = pick(s.def), tok = s.token;
  const fail = (err) => { if (tok !== s.token) return; s.loading = false; s.box.checked = false; s.stEl.classList.add('err'); s.stEl.textContent = 'failed'; s.row.title = (err && err.message) || 'Could not load this file.'; refresh(); };
  const ready = (obj) => {
    if (tok !== s.token) { obj.traverse(o => { if (o.geometry) o.geometry.dispose(); }); return; }   // density changed meanwhile
    s.loading = false; s.object = obj; s.loadedKey = src.key; obj.visible = s.box.checked; scene.add(obj);
    let n = 0, f = 0;
    obj.traverse(o => { if (o.isPoints) n += o.geometry.attributes.position.count; if (o.isMesh) { n += o.geometry.attributes.position.count; f += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; } });
    s.points = f ? 0 : n; s.faces = f; s.pared = 0;
    s.stEl.textContent = f ? (f / 1000).toFixed(0) + 'k f' : fmtCount(n);
    applyPare(s);
    refresh();
  };
  new PLYLoader().load(src.file, (geo) => {
    if (geo.attributes.normal) geo.deleteAttribute('normal');
    if (s.def.texture) {   // photo mesh: per-face UVs and one atlas image
      s.stEl.textContent = 'photo…';
      new THREE.TextureLoader().load(s.def.texture, (tex) => {
        tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
        const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide }));
        m.applyMatrix4(TO_KART); ready(m);
      }, undefined, () => fail(new Error('The photo texture did not load.')));
    } else if (s.def.path) { ready(buildPath(geo)); }
    else {
      s.material = new THREE.PointsMaterial({ size: pointSize, sizeAttenuation: false, vertexColors: true });
      applyTint(s); ready(new THREE.Points(geo, s.material));
    }
  }, (e) => { if (tok !== s.token) return; if (e.lengthComputable && e.total) s.stEl.textContent = Math.min(99, Math.round(100 * e.loaded / e.total)) + ' %'; else s.stEl.textContent = ((e.loaded || 0) / 1048576).toFixed(0) + ' MB'; }, fail);
}

for (const def of LAYERS) addRow(def);

// ?show=a,b,c picks the layers to open with. Without it the page opens with the combined cloud,
// or with the photo mesh if the layer list has no combined cloud.
const asked = new URLSearchParams(location.search).get('show');
const want = (asked || '').split(',').map(s => s.trim()).filter(Boolean);
for (const id of want) if (state[id]) toggle(id, true);
const openWith = (id) => { if (!asked && state[id] && !state[id].box.checked) toggle(id, true); };

fetch(MORE, { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(j => {
  if (!j || !Array.isArray(j.layers)) { openWith('textured'); return; }
  const c = j.combined;   // one cloud averaged from the dense clouds: listed first, with its own paring slider
  if (c && c.id && Array.isArray(c.variants) && !state[c.id]) { addRow({ group: c.group || 'Combined', sub: c.sub }, $('firstList')); addRow(c, $('firstList')); }
  if (j.group) addRow({ group: j.group, sub: j.sub });
  for (const d of j.layers) { if (d && d.id && (d.file || d.variants) && !state[d.id]) addRow(d); }
  for (const id of want) if (state[id] && !state[id].box.checked) toggle(id, true);
  openWith(c && state[c.id] ? c.id : 'textured');
  layout();
}).catch(() => { openWith('textured'); });

// Split view: one cutting plane per axis. A ticked axis hides everything on one side of its
// slider position (kart frame, inches); the button switches the side that stays.
// ?cutx=-35&cuty=0&cutz=40 opens the page with cuts set. The lower side stays by default;
// an "h" after the number (cutz=40h) keeps the higher side instead.
const query = new URLSearchParams(location.search);
const CUTS = [...document.querySelectorAll('.cutrow')].map(row => {
  const c = { axis: +row.dataset.axis, low: row.dataset.low, high: row.dataset.high, box: row.querySelector('input[type=checkbox]'),
    slider: row.querySelector('input[type=range]'), val: row.querySelector('.val'), side: row.querySelector('button'), keepHigh: false, plane: new THREE.Plane() };
  c.start = +c.slider.value;
  const q = (query.get('cut' + 'xyz'[c.axis]) || '').match(/^(-?\d+(?:\.\d+)?)(h?)$/);
  if (q) { c.slider.value = q[1]; c.keepHigh = q[2] === 'h'; c.box.checked = true; }
  c.box.onchange = updateCuts;
  c.slider.oninput = () => { c.box.checked = true; updateCuts(); };
  c.side.onclick = () => { c.keepHigh = !c.keepHigh; c.box.checked = true; updateCuts(); };
  c.side.title = 'The side of the cut that stays visible. Click to switch.';
  return c;
});
function updateCuts() {
  const planes = [], cuts = {};
  for (const c of CUTS) {
    const v = +c.slider.value, n = new THREE.Vector3().setComponent(c.axis, c.keepHigh ? 1 : -1);
    c.plane.set(n, c.keepHigh ? -v : v);
    c.val.textContent = v.toFixed(2) + ' in';
    c.side.textContent = c.keepHigh ? c.high : c.low;
    c.side.classList.toggle('on', c.box.checked);
    if (c.box.checked) { planes.push(c.plane); cuts['xyz'[c.axis]] = { at: v, keeps: c.keepHigh ? 'higher' : 'lower' }; }
  }
  renderer.clippingPlanes = planes;
  window.__cuts = cuts;
}
$('cutReset').onclick = () => { for (const c of CUTS) { c.box.checked = false; c.keepHigh = false; c.slider.value = c.start; } updateCuts(); };
$('cutHead').onclick = () => { const c = $('cut').classList.toggle('closed'); $('cutTog').textContent = c ? 'show' : 'hide'; layout(); };
updateCuts();

$('layersHead').onclick =() => { const c = $('layers').classList.toggle('closed'); $('layersTog').textContent = c ? 'show' : 'hide'; };
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));
$('density').value = density;
$('density').onchange = (e) => setDensity(e.target.value);
$('size').oninput = (e) => { pointSize = +e.target.value; for (const id in state) { if (state[id].material) state[id].material.size = pointSize; if (state[id].fillLook) state[id].fillLook.size = pointSize; } };
$('tint').onchange = (e) => { tintOn = e.target.checked; for (const id in state) applyTint(state[id]); };
$('axes').onchange = (e) => { helpers.visible = e.target.checked; };
function setGap(i) { gap = GAPS[i]; $('fill').value = i; $('fillVal').textContent = gap ? 'gaps up to ' + gap + ' in' : 'off'; refresh(); }
$('fill').oninput = (e) => setGap(+e.target.value);
$('fillFlag').onchange = (e) => { markFill = e.target.checked; for (const id in state) styleFill(state[id]); };
{ // ?fill=1 opens with gaps up to 1 in filled; ?fill=1m also marks the predicted points
  const q = (new URLSearchParams(location.search).get('fill') || '').match(/^(\d+(?:\.\d+)?)(m?)$/);
  if (q) { let best = 0; GAPS.forEach((g, i) => { if (Math.abs(g - q[1]) < Math.abs(GAPS[best] - q[1])) best = i; }); markFill = q[2] === 'm'; $('fillFlag').checked = markFill; setGap(best); }
  else setGap(2);   // gaps up to half an inch are filled unless the address says otherwise (?fill=0 is off)
}
// The toolbar wraps to more rows on a narrow screen, so the panels are placed from its real
// height; on a phone they open from the two tabs under the view buttons.
const narrow = () => innerWidth <= 640;
if (matchMedia('(pointer: coarse)').matches) $('help').textContent = 'One finger: rotate · Two fingers: pan and zoom · Inches; X forward (red), Y left (green), Z up (blue)';
function layout() {
  const lay = $('layers'), cut = $('cut'), opts = $('opts'), body = lay.querySelector('.body');
  // on a phone the settings and the point count live inside the Layers panel
  if (narrow() && opts.parentNode !== body) { body.prepend(opts, statusEl); }
  if (!narrow() && opts.parentNode === body) { $('bar').append(opts); document.body.insertBefore(statusEl, $('help')); }
  const top = Math.round($('bar').getBoundingClientRect().bottom) + 6;
  lay.style.top = cut.style.top = top + 'px';
  lay.style.maxHeight = cut.style.maxHeight = narrow() ? Math.max(120, innerHeight - top - 10) + 'px' : '';
}
// Phone: the two tabs under the view buttons. A tab opens its panel; tapping it again closes it.
let openTab = null;
function showTab(name) {
  openTab = openTab === name ? null : name;
  $('layers').classList.toggle('closed', openTab !== 'layers'); $('layersTog').textContent = openTab === 'layers' ? 'hide' : 'show';
  $('cut').classList.toggle('closed', openTab !== 'cut'); $('cutTog').textContent = openTab === 'cut' ? 'hide' : 'show';
  for (const b of document.querySelectorAll('#tabs button')) b.classList.toggle('on', b.dataset.tab === openTab);
  layout();
}
for (const b of document.querySelectorAll('#tabs button')) b.onclick = () => showTab(b.dataset.tab);
if (narrow()) showTab(null);
layout();
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  layout();
});
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
refresh();
layout();
</script>
</body>
</html>
